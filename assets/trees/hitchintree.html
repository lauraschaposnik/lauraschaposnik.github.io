  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {

      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {

      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)

// --- AUTO LABEL TOGGLE ON ZOOM ---
var LABEL_ZOOM_THRESHOLD = 1.8;
var labelsAreFull = false;

function setLabelsFull(full) {
  var updates = [];
  nodes.forEach(function(n) {
    var wanted = full ? (n.fullLabel || n.label || "") : (n.baseLabel || "");
    updates.push({id: n.id, label: wanted});
  });
  nodes.update(updates);
  labelsAreFull = full;
}

network.on("zoom", function(params) {
  var s = params.scale;
  if (s >= LABEL_ZOOM_THRESHOLD && !labelsAreFull) {
    setLabelsFull(true);
  } else if (s < LABEL_ZOOM_THRESHOLD && labelsAreFull) {
    setLabelsFull(false);
  }
});

// --- Search + highlight path (uses precomputed parent map in Python via tooltips; JS uses graph BFS) ---
var ROOT_ID = 43911;

function resetHighlight() {
  var nodeUpdates = [];
  nodes.forEach(function(n) {
    var c = n.origColor || "#BBBBBB";
    nodeUpdates.push({ id: n.id, color: c, borderWidth: 1 });
  });
  nodes.update(nodeUpdates);

  var edgeUpdates = [];
  edges.forEach(function(e) {
    edgeUpdates.push({ id: e.id, color: "rgba(140,140,140,0.22)", width: 1 });
  });
  edges.update(edgeUpdates);

  document.getElementById("pathOut").innerHTML = "";
  document.getElementById("results").innerHTML = "";
}

function buildAdjacency() {
  var adj = new Map();
  edges.forEach(function(e) {
    if (!adj.has(e.from)) adj.set(e.from, []);
    adj.get(e.from).push(e.to);
  });
  return adj;
}

function shortestPath(root, target) {
  if (root === target) return [root];
  var adj = buildAdjacency();
  var q = [root];
  var prev = new Map();
  prev.set(root, null);

  while (q.length > 0) {
    var u = q.shift();
    var nbrs = adj.get(u) || [];
    for (var i = 0; i < nbrs.length; i++) {
      var v = nbrs[i];
      if (!prev.has(v)) {
        prev.set(v, u);
        if (v === target) {
          var path = [];
          var cur = v;
          while (cur !== null) {
            path.push(cur);
            cur = prev.get(cur);
          }
          path.reverse();
          return path;
        }
        q.push(v);
      }
    }
  }
  return null;
}

function showPath(path) {
  if (!path || path.length === 0) return;

  // highlight nodes
  nodes.update(path.map(function(id) { return { id: id, borderWidth: 6 }; }));

  // highlight edges
  var edgeUpdates = [];
  for (var i = 0; i < path.length - 1; i++) {
    var u = path[i], v = path[i+1];
    edgeUpdates.push({
      id: String(u) + "->" + String(v),
      color: "rgba(0,0,0,0.65)",
      width: 4
    });
  }
  edges.update(edgeUpdates);

  // zoom to path
  network.fit({
    nodes: path,
    animation: { duration: 600, easingFunction: "easeInOutQuad" }
  });

  // path text
  var names = path.map(function(id) {
    var n = nodes.get(id);
    return n && n.fullLabel ? n.fullLabel : String(id);
  });
  document.getElementById("pathOut").innerHTML =
    "<b>Branch to Hitchin</b><br>" + names.join(" → ");
}

function runSearch() {
  var q = document.getElementById("searchBox").value.trim().toLowerCase();
  if (!q) return;

  var matches = [];
  nodes.forEach(function(n) {
    var name = (n.fullLabel || n.label || "").toLowerCase();
    if (name.includes(q)) matches.push(n);
  });

  var resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  if (matches.length === 0) {
    resultsDiv.innerHTML = "<div style='color:#666;'>No matches.</div>";
    return;
  }

  matches.sort(function(a,b) {
    var da = (a.depth === null || a.depth === undefined) ? 9999 : a.depth;
    var db = (b.depth === null || b.depth === undefined) ? 9999 : b.depth;
    if (da !== db) return da - db;
    return (a.fullLabel || "").localeCompare(b.fullLabel || "");
  });

  var shown = matches.slice(0, 50);
  resultsDiv.innerHTML = "<div style='margin-bottom:6px; color:#333;'><b>Matches</b> (" + matches.length + ")</div>";

  shown.forEach(function(n) {
    var btn = document.createElement("button");
    btn.textContent = (n.fullLabel || n.id) + (n.depth !== undefined && n.depth !== null ? ("  (level " + n.depth + ")") : "");
    btn.style.cssText = "display:block; width:100%; text-align:left; margin:4px 0; padding:6px 8px; border-radius:8px; border:1px solid rgba(0,0,0,0.15); background:#fff; cursor:pointer;";
    btn.onclick = function() {
      resetHighlight();
      document.getElementById("searchBox").value = q;
      var path = shortestPath(ROOT_ID, n.id);
      if (!path) {
        document.getElementById("pathOut").innerHTML = "<b>Branch to Hitchin</b><br><span style='color:#666;'>No directed path found from Hitchin.</span>";
        network.focus(n.id, { scale: 1.6, animation: true });
        return;
      }
      showPath(path);
    };
    resultsDiv.appendChild(btn);
  });

  if (matches.length > 50) {
    var more = document.createElement("div");
    more.style.cssText = "margin-top:6px; color:#666; font-size:12px;";
    more.textContent = "Showing first 50 results. Refine search to narrow.";
    resultsDiv.appendChild(more);
  }
}

document.getElementById("searchBtn").onclick = runSearch;
document.getElementById("clearBtn").onclick = function() {
  document.getElementById("searchBox").value = "";
  resetHighlight();
};

document.getElementById("searchBox").addEventListener("keydown", function(e) {
  if (e.key === "Enter") runSearch();
});

resetHighlight();
